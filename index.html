<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Clasificación de Mercadería</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #111827;
      padding-bottom: 40px;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .search-row input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    .search-row input:focus {
      border-color: #2563eb;
      outline: none;
      background: white;
    }

    .search-row .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #2563eb;
      color: white;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .search-row .btn:active {
      transform: scale(0.96);
    }

    .sugerencias {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      max-height: 260px;
      overflow-y: auto;
      z-index: 40;
    }

    .sugerencia-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sugerencia-item:active {
      background: #eff6ff;
    }

    .sugerencia-item .sug-nombre {
      font-weight: 600;
      font-size: 14px;
    }

    .sugerencia-item .sug-codigo {
      font-size: 12px;
      color: #6b7280;
      font-family: monospace;
    }

    .sugerencia-item:last-child {
      border-bottom: none;
    }

    .resultado-box {
      display: none;
    }

    .resultado-box.show {
      display: block;
    }

    .resultado-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .resultado-nombre {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    .resultado-nombre.no-encontrado {
      color: #dc2626;
    }

    .resultado-codigo {
      font-size: 13px;
      color: #6b7280;
      font-family: monospace;
      background: #f3f4f6;
      padding: 2px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 2px;
    }

    .categoria-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 12px;
    }

    .categoria-btn {
      padding: 12px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .categoria-btn:active {
      transform: scale(0.96);
    }

    .categoria-btn .emoji {
      font-size: 20px;
      display: block;
      margin-bottom: 2px;
    }

    .categoria-btn.seleccionada {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: 0 0 0 2px #bfdbfe;
    }

    .categoria-btn.seleccionada.roto {
      border-color: #dc2626;
      background: #fef2f2;
      box-shadow: 0 0 0 2px #fecaca;
    }

    .categoria-btn.seleccionada.vencido {
      border-color: #f59e0b;
      background: #fffbeb;
      box-shadow: 0 0 0 2px #fde68a;
    }

    .categoria-btn.seleccionada.cambio {
      border-color: #8b5cf6;
      background: #f5f3ff;
      box-shadow: 0 0 0 2px #ddd6fe;
    }

    .categoria-btn.seleccionada.comedor {
      border-color: #059669;
      background: #ecfdf5;
      box-shadow: 0 0 0 2px #a7f3d0;
    }

    .categoria-btn .label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 400;
      display: block;
      margin-top: 2px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fafafa;
      transition: border-color 0.2s;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #2563eb;
      outline: none;
      background: white;
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn-guardar {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #16a34a;
      color: white;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-guardar:active {
      transform: scale(0.97);
    }

    .btn-guardar:disabled {
      opacity: 0.5;
      transform: none;
    }

    .btn-guardar.roto {
      background: #dc2626;
    }

    .btn-guardar.vencido {
      background: #f59e0b;
    }

    .btn-guardar.cambio {
      background: #7c3aed;
    }

    .btn-guardar.comedor {
      background: #059669;
    }

    .btn-descartar {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #f3f4f6;
      color: #6b7280;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-descartar:active {
      background: #e5e7eb;
    }

    .btn-escaneo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 2px dashed #2563eb;
      border-radius: 12px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-escaneo:active {
      background: #dbeafe;
    }

    .btn-escaneo .icon {
      font-size: 22px;
    }

    #reader-container {
      display: none;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
    }

    #reader-container video {
      border-radius: 12px;
    }

    .btn-cancelar-scan {
      display: none;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-cancelar-scan:active {
      background: #e5e7eb;
    }

    .historial-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      gap: 10px;
    }

    .historial-item:last-child {
      border-bottom: none;
    }

    .historial-item .h-info {
      flex: 1;
      min-width: 0;
    }

    .historial-item .h-nombre {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .historial-item .h-detalle {
      font-size: 12px;
      color: #6b7280;
    }

    .historial-item .h-categoria {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .historial-item .h-categoria.roto {
      background: #fef2f2;
      color: #dc2626;
    }

    .historial-item .h-categoria.vencido {
      background: #fffbeb;
      color: #f59e0b;
    }

    .historial-item .h-categoria.cambio {
      background: #f5f3ff;
      color: #7c3aed;
    }

    .historial-item .h-categoria.comedor {
      background: #ecfdf5;
      color: #059669;
    }

    .historial-vacio {
      color: #6b7280;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }

    .badge-count {
      background: #e5e7eb;
      color: #374151;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.error {
      background: #dc2626;
    }

    .toast.success {
      background: #16a34a;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #e5e7eb;
      }
      .card {
        background: #1e293b;
      }
      .search-row input,
      .field input,
      .field textarea {
        background: #334155;
        border-color: #475569;
        color: #e5e7eb;
      }
      .search-row input:focus,
      .field input:focus,
      .field textarea:focus {
        background: #1e293b;
        border-color: #60a5fa;
      }
      .sugerencias {
        background: #1e293b;
        border-color: #475569;
      }
      .sugerencia-item {
        border-bottom-color: #334155;
      }
      .sugerencia-item .sug-nombre {
        color: #e5e7eb;
      }
      .sugerencia-item:active {
        background: #334155;
      }
      .resultado-codigo {
        background: #334155;
        color: #94a3b8;
      }
      .categoria-btn {
        background: #1e293b;
        border-color: #475569;
        color: #e5e7eb;
      }
      .categoria-btn.seleccionada {
        background: #334155;
        border-color: #60a5fa;
      }
      .categoria-btn.seleccionada.roto {
        border-color: #ef4444;
        background: #3f1f1f;
      }
      .categoria-btn.seleccionada.vencido {
        border-color: #f59e0b;
        background: #3f2f0f;
      }
      .categoria-btn.seleccionada.cambio {
        border-color: #8b5cf6;
        background: #2f1f4f;
      }
      .categoria-btn.seleccionada.comedor {
        border-color: #059669;
        background: #0f3f2a;
      }
      .btn-escaneo {
        background: #1e293b;
        border-color: #60a5fa;
        color: #60a5fa;
      }
      .btn-escaneo:active {
        background: #334155;
      }
      .btn-descartar {
        background: #1e293b;
        color: #94a3b8;
      }
      .btn-descartar:active {
        background: #334155;
      }
      .historial-item {
        border-bottom-color: #334155;
      }
      .historial-item .h-detalle {
        color: #94a3b8;
      }
      .badge-count {
        background: #334155;
        color: #94a3b8;
      }
      .historial-vacio {
        color: #94a3b8;
      }
      .card-title {
        color: #94a3b8;
      }
      .field label {
        color: #94a3b8;
      }
      .categoria-btn .label {
        color: #94a3b8;
      }
      header {
        background: #0f172a;
      }
      .toast {
        background: #1e293b;
        color: #e5e7eb;
      }
      .toast.error {
        background: #7f1d1d;
      }
      .toast.success {
        background: #065f46;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Clasificación de Mercadería</h1>
    <p>Roto · Vencido · Con cambio · Comedor</p>
  </header>

  <div class="container">

    <!-- BÚSQUEDA -->
    <div class="card">
      <div class="card-title">🔍 Buscar producto</div>
      <div class="search-row">
        <input type="text" id="inputBusqueda" placeholder="Código o descripción..." autocomplete="off" />
        <button class="btn" id="btnBuscar">Buscar</button>
      </div>
      <div class="sugerencias" id="sugerencias"></div>
      <button class="btn-escaneo" id="btnEscanear">
        <span class="icon">📷</span> Escanear código de barras
      </button>
      <div id="reader-container"></div>
      <button class="btn-cancelar-scan" id="btnCancelarScan">Cancelar escaneo</button>
    </div>

    <!-- RESULTADO -->
    <div class="card resultado-box" id="resultadoBox">
      <div class="resultado-header">
        <div>
          <div class="resultado-nombre" id="rNombre">Producto</div>
          <div class="resultado-codigo" id="rCodigo">Código</div>
        </div>
      </div>

      <div class="categoria-grid">
        <button class="categoria-btn" data-categoria="roto">
          <span class="emoji">💔</span> Roto
          <span class="label">Producto dañado</span>
        </button>
        <button class="categoria-btn" data-categoria="vencido">
          <span class="emoji">⏰</span> Vencido
          <span class="label">Fuera de fecha</span>
        </button>
        <button class="categoria-btn" data-categoria="cambio">
          <span class="emoji">🔄</span> Con cambio
          <span class="label">Cambio de embalaje</span>
        </button>
        <button class="categoria-btn" data-categoria="comedor">
          <span class="emoji">🍽️</span> Comedor
          <span class="label">Enviar a comedor</span>
        </button>
      </div>

      <div class="field">
        <label>Cantidad de unidades</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="btnCantMenos" style="width:44px;height:44px;border:none;border-radius:10px;background:#e5e7eb;font-size:22px;font-weight:700;cursor:pointer;">−</button>
          <input type="number" id="inputCantidad" value="1" min="1" style="flex:1;text-align:center;font-size:18px;font-weight:700;padding:10px;border:2px solid #e5e7eb;border-radius:10px;background:#fafafa;">
          <button id="btnCantMas" style="width:44px;height:44px;border:none;border-radius:10px;background:#e5e7eb;font-size:22px;font-weight:700;cursor:pointer;">+</button>
        </div>
      </div>

      <div class="field">
        <label>Observaciones (opcional)</label>
        <textarea id="inputObservaciones" placeholder="Ej: Lote X, vence 12/25, etc."></textarea>
      </div>

      <button class="btn-guardar" id="btnGuardar">✔ Guardar clasificación</button>
      <button class="btn-descartar" id="btnDescartar">Descartar</button>
    </div>

    <!-- HISTORIAL DE LA SESIÓN -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="card-title" style="margin-bottom:0;">📝 Clasificados hoy</span>
        <span class="badge-count" id="contadorHistorial">0</span>
      </div>
      <div id="historialLista">
        <div class="historial-vacio">Todavía no clasificaste nada</div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>
  <script>
    // ============================================================
    // CONFIGURACIÓN
    // ============================================================

    const firebaseConfig = {
      apiKey: "AIzaSyBjsx_gcl2X1yr8SPoi_tF3qGcrFRLK3bQ",
      authDomain: "armador-de-pedidos-secos-119b3.firebaseapp.com",
      projectId: "armador-de-pedidos-secos-119b3",
      storageBucket: "armador-de-pedidos-secos-119b3.firebasestorage.app",
      messagingSenderId: "713677759926",
      appId: "1:713677759926:web:e0a8f512d79f75f2a5cd17"
    };

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-gKZ3L8ySGrn4TJsQ-7J-zXWbO2vMrtc5b8r20ctrBDR2zSzPBWJq5gGX3b7lsI_q/exec";

    // ============================================================
    // FIREBASE
    // ============================================================
    let db = null;
    let catalogoCache = {};

    async function initFirebase() {
      try {
        const { initializeApp } = await import(
          "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js"
        );
        const { getFirestore, collection, query, where, orderBy, limit, getDocs, doc, getDoc } =
          await import(
            "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js"
          );

        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);

        window.__fb = { collection, query, where, orderBy, limit, getDocs, doc, getDoc };
        console.log("✅ Firebase inicializado");
        return true;
      } catch (err) {
        console.error("Error:", err);
        mostrarToast("Error conectando a Firebase", "error");
        return false;
      }
    }

    // ============================================================
    // BUSCAR PRODUCTOS POR TEXTO (desde Firebase)
    // ============================================================
    async function buscarProductosPorTexto(texto) {
      texto = texto.trim().toLowerCase();
      if (texto.length < 2) return [];

      try {
        const { collection, query, where, orderBy, limit, getDocs } = window.__fb;

        // Buscar por productoLower (prefijo)
        const q = query(
          collection(db, 'productos'),
          where('productoLower', '>=', texto),
          where('productoLower', '<=', texto + '\uf8ff'),
          orderBy('productoLower'),
          limit(10)
        );

        const snap = await getDocs(q);
        const resultados = [];
        snap.forEach(doc => {
          const data = doc.data();
          resultados.push({
            codigo: doc.id,
            producto: data.producto || doc.id
          });
        });

        return resultados;
      } catch (err) {
        console.error("Error buscando:", err);
        return [];
      }
    }

    // ============================================================
    // BUSCAR PRODUCTO POR CÓDIGO (exacto)
    // ============================================================
    async function buscarProductoPorCodigo(codigo) {
      codigo = String(codigo).trim();
      if (!codigo) return null;

      try {
        const { doc, getDoc } = window.__fb;
        const ref = doc(db, 'productos', codigo);
        const snap = await getDoc(ref);

        if (snap.exists()) {
          const data = snap.data();
          return {
            codigo: codigo,
            producto: data.producto || codigo,
            encontrado: true
          };
        }

        return {
          codigo: codigo,
          producto: null,
          encontrado: false
        };
      } catch (err) {
        console.error("Error:", err);
        return {
          codigo: codigo,
          producto: null,
          encontrado: false
        };
      }
    }

    // ============================================================
    // ESTADO GLOBAL
    // ============================================================
    let productoActual = null;
    let categoriaSeleccionada = null;
    let historial = [];
    let html5QrCode = null;
    let escaneoActivo = false;
    let timeoutBusqueda = null;

    // ============================================================
    // REFERENCIAS DOM
    // ============================================================
    const inputBusqueda = document.getElementById('inputBusqueda');
    const btnBuscar = document.getElementById('btnBuscar');
    const sugerencias = document.getElementById('sugerencias');
    const btnEscanear = document.getElementById('btnEscanear');
    const readerContainer = document.getElementById('reader-container');
    const btnCancelarScan = document.getElementById('btnCancelarScan');

    const resultadoBox = document.getElementById('resultadoBox');
    const rNombre = document.getElementById('rNombre');
    const rCodigo = document.getElementById('rCodigo');

    const categoriaBtns = document.querySelectorAll('.categoria-btn');
    const inputCantidad = document.getElementById('inputCantidad');
    const btnCantMenos = document.getElementById('btnCantMenos');
    const btnCantMas = document.getElementById('btnCantMas');
    const inputObservaciones = document.getElementById('inputObservaciones');
    const btnGuardar = document.getElementById('btnGuardar');
    const btnDescartar = document.getElementById('btnDescartar');

    const historialLista = document.getElementById('historialLista');
    const contadorHistorial = document.getElementById('contadorHistorial');
    const toast = document.getElementById('toast');

    // ============================================================
    // AUTOCOMPLETADO EN VIVO
    // ============================================================
    inputBusqueda.addEventListener('input', () => {
      const texto = inputBusqueda.value.trim();
      clearTimeout(timeoutBusqueda);

      if (texto.length < 2) {
        ocultarSugerencias();
        return;
      }

      timeoutBusqueda = setTimeout(async () => {
        const resultados = await buscarProductosPorTexto(texto);
        renderizarSugerencias(resultados);
      }, 300);
    });

    inputBusqueda.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const texto = inputBusqueda.value.trim();
        if (texto) {
          ocultarSugerencias();
          buscarYMostrar(texto);
        }
      }
    });

    btnBuscar.addEventListener('click', () => {
      const texto = inputBusqueda.value.trim();
      if (texto) {
        ocultarSugerencias();
        buscarYMostrar(texto);
      }
    });

    function renderizarSugerencias(resultados) {
      if (!resultados || !resultados.length) {
        ocultarSugerencias();
        return;
      }

      sugerencias.innerHTML = resultados.map(r => `
        <div class="sugerencia-item" data-codigo="${escapeHtml(r.codigo)}">
          <div class="sug-nombre">${escapeHtml(r.producto)}</div>
          <div class="sug-codigo">${escapeHtml(r.codigo)}</div>
        </div>
      `).join('');

      sugerencias.style.display = 'block';

      sugerencias.querySelectorAll('.sugerencia-item').forEach(el => {
        el.addEventListener('click', () => {
          const codigo = el.dataset.codigo;
          ocultarSugerencias();
          inputBusqueda.value = '';
          buscarYMostrar(codigo);
        });
      });
    }

    function ocultarSugerencias() {
      sugerencias.style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#inputBusqueda') && !e.target.closest('#sugerencias')) {
        ocultarSugerencias();
      }
    });

    // ============================================================
    // BÚSQUEDA PRINCIPAL
    // ============================================================
    async function buscarYMostrar(query) {
      const esCodigo = /^[A-Za-z0-9\-]{4,20}$/.test(query);

      let resultado;
      if (esCodigo) {
        resultado = await buscarProductoPorCodigo(query);
      } else {
        // Buscar por texto
        const resultados = await buscarProductosPorTexto(query);
        if (resultados && resultados.length > 0) {
          // Tomar el primero
          const primero = resultados[0];
          resultado = await buscarProductoPorCodigo(primero.codigo);
        } else {
          resultado = {
            codigo: query,
            producto: null,
            encontrado: false
          };
        }
      }

      mostrarResultado(resultado);
    }

    // ============================================================
    // MOSTRAR RESULTADO
    // ============================================================
    function mostrarResultado(resultado) {
      productoActual = resultado;
      categoriaSeleccionada = null;

      categoriaBtns.forEach(b => b.classList.remove('seleccionada'));

      rNombre.textContent = resultado.encontrado ? resultado.producto : '⚠ Producto no encontrado';
      rNombre.classList.toggle('no-encontrado', !resultado.encontrado);
      rCodigo.textContent = resultado.codigo;

      inputCantidad.value = 1;
      inputObservaciones.value = '';

      resultadoBox.classList.add('show');
      resultadoBox.scrollIntoView({ behavior: 'smooth', block: 'center' });

      btnGuardar.className = 'btn-guardar';
    }

    // ============================================================
    // CATEGORÍAS
    // ============================================================
    categoriaBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const categoria = btn.dataset.categoria;

        if (categoriaSeleccionada === categoria) {
          categoriaSeleccionada = null;
          btn.classList.remove('seleccionada');
          btnGuardar.className = 'btn-guardar';
          return;
        }

        categoriaBtns.forEach(b => b.classList.remove('seleccionada'));
        categoriaSeleccionada = categoria;
        btn.classList.add('seleccionada');

        btnGuardar.className = 'btn-guardar ' + categoria;
      });
    });

    // ============================================================
    // CANTIDAD
    // ============================================================
    btnCantMenos.addEventListener('click', () => {
      let val = parseInt(inputCantidad.value) || 1;
      if (val > 1) val--;
      inputCantidad.value = val;
    });

    btnCantMas.addEventListener('click', () => {
      let val = parseInt(inputCantidad.value) || 1;
      val++;
      inputCantidad.value = val;
    });

    inputCantidad.addEventListener('change', () => {
      let val = parseInt(inputCantidad.value) || 1;
      if (val < 1) val = 1;
      inputCantidad.value = val;
    });

    // ============================================================
    // GUARDAR CLASIFICACIÓN
    // ============================================================
    btnGuardar.addEventListener('click', async () => {
      if (!productoActual) {
        mostrarToast('Primero buscá un producto', 'error');
        return;
      }

      if (!categoriaSeleccionada) {
        mostrarToast('Seleccioná una categoría', 'error');
        return;
      }

      const cantidad = parseInt(inputCantidad.value) || 1;
      if (cantidad < 1) {
        mostrarToast('Cantidad inválida', 'error');
        return;
      }

      const observaciones = inputObservaciones.value.trim();

      const datos = {
        accion: 'guardarClasificacion',
        codigo: productoActual.codigo,
        producto: productoActual.encontrado ? productoActual.producto : 'NO ENCONTRADO',
        categoria: categoriaSeleccionada,
        cantidad: cantidad,
        observaciones: observaciones || '',
        timestamp: new Date().toISOString()
      };

      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando...';

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        mostrarToast('✅ Guardado correctamente', 'success');

        agregarAlHistorial({
          codigo: productoActual.codigo,
          producto: productoActual.encontrado ? productoActual.producto : 'NO ENCONTRADO',
          categoria: categoriaSeleccionada,
          cantidad: cantidad,
          observaciones: observaciones || ''
        });

        categoriaBtns.forEach(b => b.classList.remove('seleccionada'));
        categoriaSeleccionada = null;
        btnGuardar.className = 'btn-guardar';
        inputCantidad.value = 1;
        inputObservaciones.value = '';

        setTimeout(() => {
          resultadoBox.classList.remove('show');
        }, 800);

      } catch (err) {
        console.error('Error guardando:', err);
        mostrarToast('Error guardando: ' + err.message, 'error');
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = '✔ Guardar clasificación';
      }
    });

    // ============================================================
    // HISTORIAL LOCAL
    // ============================================================
    function agregarAlHistorial(item) {
      historial.unshift(item);
      renderizarHistorial();
    }

    function renderizarHistorial() {
      contadorHistorial.textContent = historial.length;

      if (historial.length === 0) {
        historialLista.innerHTML = '<div class="historial-vacio">Todavía no clasificaste nada</div>';
        return;
      }

      const etiquetas = {
        roto: '💔 Roto',
        vencido: '⏰ Vencido',
        cambio: '🔄 Cambio',
        comedor: '🍽️ Comedor'
      };

      historialLista.innerHTML = historial.map(item => `
        <div class="historial-item">
          <div class="h-info">
            <div class="h-nombre">${escapeHtml(item.producto)}</div>
            <div class="h-detalle">${escapeHtml(item.codigo)} · ${item.cantidad} u.${item.observaciones ? ' · ' + escapeHtml(item.observaciones) : ''}</div>
          </div>
          <span class="h-categoria ${item.categoria}">${etiquetas[item.categoria] || item.categoria}</span>
        </div>
      `).join('');
    }

    // ============================================================
    // DESCARTAR
    // ============================================================
    btnDescartar.addEventListener('click', () => {
      resultadoBox.classList.remove('show');
      productoActual = null;
      categoriaSeleccionada = null;
      categoriaBtns.forEach(b => b.classList.remove('seleccionada'));
      btnGuardar.className = 'btn-guardar';
    });

    // ============================================================
    // ESCANEO
    // ============================================================
    btnEscanear.addEventListener('click', iniciarEscaneo);
    btnCancelarScan.addEventListener('click', detenerEscaneo);

    async function iniciarEscaneo() {
      if (escaneoActivo) return;

      try {
        readerContainer.style.display = 'block';
        btnCancelarScan.style.display = 'block';
        btnEscanear.style.display = 'none';
        escaneoActivo = true;

        html5QrCode = new Html5Qrcode("reader-container");
        const config = {
          fps: 10,
          qrbox: { width: 260, height: 140 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        };

        await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
      } catch (err) {
        console.error('Error:', err);
        mostrarToast('No se pudo abrir la cámara', 'error');
        detenerEscaneo();
      }
    }

    function onScanSuccess(codigo) {
      if (navigator.vibrate) navigator.vibrate(80);
      detenerEscaneo();
      buscarYMostrar(codigo);
    }

    function detenerEscaneo() {
      escaneoActivo = false;
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {});
      }
      readerContainer.style.display = 'none';
      btnCancelarScan.style.display = 'none';
      btnEscanear.style.display = 'flex';
    }

    // ============================================================
    // TOAST
    // ============================================================
    let timeoutToast = null;

    function mostrarToast(msg, tipo = '') {
      toast.textContent = msg;
      toast.className = 'toast';
      if (tipo) toast.classList.add(tipo);
      toast.classList.add('show');

      clearTimeout(timeoutToast);
      timeoutToast = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      } [s]));
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    (async function init() {
      await initFirebase();

      try {
        const guardado = localStorage.getItem('clasificacion_historial');
        if (guardado) {
          historial = JSON.parse(guardado);
          renderizarHistorial();
        }
      } catch (e) { /* ignore */ }

      console.log('✅ App lista');
    })();

    const originalAgregar = agregarAlHistorial;
    agregarAlHistorial = function(item) {
      originalAgregar(item);
      try {
        localStorage.setItem('clasificacion_historial', JSON.stringify(historial));
      } catch (e) { /* ignore */ }
    };
  </script>

</body>
</html>
